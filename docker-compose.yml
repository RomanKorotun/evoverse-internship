services:
  backend:
    build:
      context: ./backend
      target: development
      dockerfile: Dockerfile
    image: node_app_image_hw_5
    container_name: node_app_hw_5
    volumes:
      - ./backend:/app
      - node_app_hw_5-modules:/app/node_modules
    environment:
      - PORT_INTERNAL=${BACKEND_PORT_INTERNAL}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - ACCESS_TOKEN_TIME=${ACCESS_TOKEN_TIME}
    ports:
      - "${BACKEND_PORT_EXTERNAL}:${BACKEND_PORT_INTERNAL}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: react_app_image_hw_5
    container_name: react_app_hw_5
    volumes:
      - ./frontend:/app
      - react_app_hw_5-modules:/app/node_modules
    environment:
      - VITE_API_URL=${API_URL}
    ports:
      - "5173:5173"

volumes:
  node_app_hw_5-modules:
  react_app_hw_5-modules:
