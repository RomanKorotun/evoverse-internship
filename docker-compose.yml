services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: node_app_image_hw_3
    container_name: node_app_hw_3
    volumes:
      - ./backend:/app
      - node_app_hw_3-modules:/app/node_modules
    ports:
      - "3030:3030"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6385:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data_hw3:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: react_app_image_hw_3
    container_name: react_app_hw_3
    volumes:
      - ./frontend:/app
      - react_app_hw_3-modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  node_app_hw_3-modules:
  redis_data_hw3:
  react_app_hw_3-modules:
